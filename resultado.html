<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultado da verificação | Desmontando Boatos</title>
  <meta name="description" content="Resultado da verificação de uma alegação com dados oficiais: classificação, o que foi confirmado ou desmentido, documentos consultados e limitações.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pages/resultado.js"></script>
</head>
<body>
  <main id="conteudo" class="wrap">
    <form id="busca" role="search" autocomplete="off" style="margin-bottom:1.5rem">
      <label for="q" class="field"><span>Desmontando Boatos: o que você quer verificar?</span></label>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <textarea id="q" rows="2" required style="flex:1;min-width:240px;font:inherit;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)" placeholder="Pesquise uma notícia, declaração, denúncia ou acontecimento..."></textarea>
        <button class="btn primary" type="submit">Verificar informação</button>
      </div>
    </form>
    <div id="app" aria-live="polite"><p class="loading">Consultando os dados oficiais…</p></div>
  </main>
</body>
</html>
